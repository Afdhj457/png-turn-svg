<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PNG 转 SVG 工具</title>
<script src="https://cdn.jsdelivr.net/npm/potrace@2.1.0/dist/potrace.min.js"></script>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: system-ui, -apple-system, sans-serif;
    background: #f0f2f5;
    margin: 0;
    padding: 16px;
    color: #1e293b;
  }
  .box {
    max-width: 900px;
    margin: 0 auto;
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    padding: 20px;
  }
  h1 { font-size: 22px; margin: 0 0 6px; }
  .tip { color: #666; font-size: 13px; margin-bottom: 20px; }
  .row { display: flex; flex-wrap: wrap; gap: 20px; }
  .col { flex: 1; min-width: 280px; }
  .card {
    background: #f8fafc;
    border: 1px solid #e2e8f0;
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 16px;
  }
  .card h3 { margin: 0 0 12px; font-size: 15px; }
  .upload {
    border: 2px dashed #cbd5e1;
    border-radius: 10px;
    padding: 24px 12px;
    text-align: center;
    cursor: pointer;
    background: #fff;
    margin-bottom: 12px;
  }
  .upload:active { background: #eff6ff; border-color: #3b82f6; }
  .upload input { display: none; }
  .upload .big { font-size: 32px; }
  .upload .txt { font-size: 14px; color: #334155; margin-top: 6px; }
  .preview img {
    max-width: 100%;
    max-height: 200px;
    border-radius: 8px;
    display: block;
    margin: 0 auto;
    border: 1px solid #e2e8f0;
  }
  .empty {
    color: #94a3b8;
    text-align: center;
    padding: 30px 0;
    font-size: 13px;
  }
  label { font-size: 13px; display: block; margin: 10px 0 4px; }
  input[type=range] { width: 100%; }
  .btn {
    border: none;
    border-radius: 20px;
    padding: 10px 18px;
    font-size: 14px;
    cursor: pointer;
    margin: 4px 4px 0 0;
    background: #e2e8f0;
    color: #1e293b;
  }
  .btn.primary { background: #3b82f6; color: #fff; }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .svgbox {
    background: #fff;
    border: 1px dashed #cbd5e1;
    border-radius: 8px;
    padding: 10px;
    min-height: 180px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: auto;
  }
  .svgbox svg { max-width: 100%; max-height: 260px; }
  .msg { font-size: 13px; margin-top: 8px; min-height: 18px; color: #64748b; }
  .msg.err { color: #dc2626; }
  .code {
    background: #0f172a;
    color: #e2e8f0;
    font-family: monospace;
    font-size: 11px;
    padding: 10px;
    border-radius: 8px;
    max-height: 100px;
    overflow: auto;
    white-space: pre-wrap;
    word-break: break-all;
    margin-top: 10px;
  }
</style>
</head>
<body>
<div class="box">
  <h1>🧬 PNG 转 SVG 工具</h1>
  <div class="tip">基于 Potrace 算法 · 不上传任何图片</div>

  <div class="row">
    <!-- 左边 -->
    <div class="col">
      <div class="card">
        <h3>① 选择图片</h3>
        <div class="upload" id="uploadArea">
          <input type="file" id="fileInput" accept="image/*">
          <div class="big">🖼️</div>
          <div class="txt">点击选择图片</div>
        </div>
        <div class="preview" id="previewBox">
          <div class="empty">还没有选择图片</div>
        </div>
        <button class="btn" id="saveOriginalBtn" disabled style="width:100%;margin-top:10px;">💾 保存原图</button>
      </div>

      <div class="card">
        <h3>② 调整参数</h3>
        <label>黑白分界线：<span id="thVal">128</span></label>
        <input type="range" id="thSlider" min="1" max="254" value="128">

        <label>细节简化：<span id="turdVal">2</span></label>
        <input type="range" id="turdSlider" min="0" max="15" value="2">

        <label>曲线平滑度：<span id="alphaVal">1.0</span></label>
        <input type="range" id="alphaSlider" min="0" max="1.5" step="0.1" value="1.0">
      </div>
    </div>

    <!-- 右边 -->
    <div class="col">
      <div class="card">
        <h3>③ SVG 结果</h3>
        <div class="svgbox" id="svgBox">
          <div class="empty">转换后显示在这里</div>
        </div>
        <div class="code" id="svgCode">等待转换...</div>
        <div class="msg" id="msg"></div>
      </div>

      <div class="card">
        <button class="btn primary" id="convertBtn" disabled>✨ 开始转换</button>
        <button class="btn" id="saveSvgBtn" disabled>⬇️ 保存 SVG</button>
        <button class="btn" id="savePngBtn" disabled>🖼️ 保存 PNG</button>
        <button class="btn" id="resetBtn">🔄 重置</button>
      </div>
    </div>
  </div>
</div>

<script>
(function(){
  var uploadArea = document.getElementById('uploadArea');
  var fileInput = document.getElementById('fileInput');
  var previewBox = document.getElementById('previewBox');
  var svgBox = document.getElementById('svgBox');
  var svgCode = document.getElementById('svgCode');
  var msg = document.getElementById('msg');
  var thSlider = document.getElementById('thSlider');
  var thVal = document.getElementById('thVal');
  var turdSlider = document.getElementById('turdSlider');
  var turdVal = document.getElementById('turdVal');
  var alphaSlider = document.getElementById('alphaSlider');
  var alphaVal = document.getElementById('alphaVal');
  var convertBtn = document.getElementById('convertBtn');
  var saveSvgBtn = document.getElementById('saveSvgBtn');
  var savePngBtn = document.getElementById('savePngBtn');
  var saveOriginalBtn = document.getElementById('saveOriginalBtn');
  var resetBtn = document.getElementById('resetBtn');

  var currentImg = null;
  var currentSrc = '';
  var currentName = '';
  var svgStr = '';

  function setMsg(t, isErr){
    msg.textContent = t;
    msg.className = 'msg' + (isErr ? ' err' : '');
  }

  thSlider.oninput = function(){ thVal.textContent = thSlider.value; };
  turdSlider.oninput = function(){ turdVal.textContent = turdSlider.value; };
  alphaSlider.oninput = function(){ alphaVal.textContent = parseFloat(alphaSlider.value).toFixed(1); };

  uploadArea.onclick = function(){ fileInput.click(); };
  fileInput.onchange = function(e){
    if(e.target.files.length) loadFile(e.target.files[0]);
  };

  ['dragenter','dragover','dragleave','drop'].forEach(function(ev){
    uploadArea.addEventListener(ev, function(e){ e.preventDefault(); e.stopPropagation(); });
  });
  uploadArea.addEventListener('drop', function(e){
    var f = e.dataTransfer.files;
    if(f.length) loadFile(f[0]);
  });

  function loadFile(file){
    if(!file.type.startsWith('image/')){
      setMsg('请选择图片文件', true);
      return;
    }
    currentName = file.name || 'image';
    var reader = new FileReader();
    reader.onload = function(e){
      currentSrc = e.target.result;
      var img = new Image();
      img.onload = function(){
        currentImg = img;
        previewBox.innerHTML = '';
        var p = document.createElement('img');
        p.src = currentSrc;
        previewBox.appendChild(p);
        convertBtn.disabled = false;
        saveOriginalBtn.disabled = false;
        svgBox.innerHTML = '<div class="empty">转换后显示在这里</div>';
        svgCode.textContent = '等待转换...';
        saveSvgBtn.disabled = true;
        savePngBtn.disabled = true;
        svgStr = '';
        setMsg('图片已加载，点击开始转换');
      };
      img.onerror = function(){
        setMsg('图片加载失败', true);
      };
      img.src = currentSrc;
    };
    reader.readAsDataURL(file);
  }

  saveOriginalBtn.onclick = function(){
    if(!currentSrc) return;
    var a = document.createElement('a');
    a.href = currentSrc;
    var ext = 'png';
    var m = currentName.match(/\.([^.]+)$/);
    if(m) ext = m[1];
    a.download = currentName.replace(/\.[^/.]+$/, '') + '.' + ext;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setMsg('原图已保存');
  };

  function binarize(imageData, threshold){
    var w = imageData.width, h = imageData.height;
    var data = imageData.data;
    var out = new ImageData(w, h);
    var d = out.data;
    for(var i = 0; i < data.length; i += 4){
      var gray = 0.2126 * data[i] + 0.7152 * data[i+1] + 0.0722 * data[i+2];
      var v = gray < threshold ? 0 : 255;
      d[i] = d[i+1] = d[i+2] = v;
      d[i+3] = 255;
    }
    return out;
  }

  function convert(){
    if(!currentImg){
      setMsg('请先选择图片', true);
      return;
    }
    if(typeof Potrace === 'undefined'){
      setMsg('Potrace 库未加载，请检查网络后刷新', true);
      return;
    }
    setMsg('正在转换...');
    convertBtn.disabled = true;

    setTimeout(function(){
      try{
        var w = currentImg.naturalWidth || currentImg.width;
        var h = currentImg.naturalHeight || currentImg.height;
        var canvas = document.createElement('canvas');
        canvas.width = w;
        canvas.height = h;
        var ctx = canvas.getContext('2d');
        ctx.drawImage(currentImg, 0, 0);
        var imgData = ctx.getImageData(0, 0, w, h);
        var th = parseInt(thSlider.value, 10);
        var binary = binarize(imgData, th);
        var turd = parseInt(turdSlider.value, 10);
        var alpha = parseFloat(alphaSlider.value);

        var potrace = new Potrace();
        potrace.setParameters({
          turdSize: turd,
          alphaMax: alpha,
          threshold: 128,
          blackOnWhite: true,
          optCurve: true
        });
        potrace.loadImage(binary);
        var svg = potrace.getSVG();

        if(!svg || svg.trim() === ''){
          throw new Error('生成的 SVG 为空，请调整阈值');
        }
        svgStr = svg;
        svgBox.innerHTML = svg;
        svgCode.textContent = svg.length > 300 ? svg.slice(0, 300) + '...' : svg;
        saveSvgBtn.disabled = false;
        savePngBtn.disabled = false;
        setMsg('✅ 转换成功！');
      }catch(err){
        setMsg('转换失败：' + (err.message || '未知错误'), true);
        svgBox.innerHTML = '<div class="empty">转换出错</div>';
        svgCode.textContent = '转换失败';
        svgStr = '';
        saveSvgBtn.disabled = true;
        savePngBtn.disabled = true;
      }finally{
        convertBtn.disabled = false;
      }
    }, 30);
  }

  convertBtn.onclick = convert;

  saveSvgBtn.onclick = function(){
    if(!svgStr) return;
    var blob = new Blob([svgStr], {type: 'image/svg+xml;charset=utf-8'});
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = (currentName.replace(/\.[^/.]+$/, '') || 'output') + '.svg';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    setMsg('SVG 已保存');
  };

  savePngBtn.onclick = function(){
    if(!svgStr) return;
    setMsg('正在导出 PNG...');
    var w = currentImg.naturalWidth || currentImg.width;
    var h = currentImg.naturalHeight || currentImg.height;
    if(w > 2000 || h > 2000){
      var ratio = Math.min(2000/w, 2000/h);
      w = Math.floor(w * ratio);
      h = Math.floor(h * ratio);
    }
    var svgBlob = new Blob([svgStr], {type: 'image/svg+xml;charset=utf-8'});
    var url = URL.createObjectURL(svgBlob);
    var img = new Image();
    img.onload = function(){
      var c = document.createElement('canvas');
      c.width = w;
      c.height = h;
      var cx = c.getContext('2d');
      cx.fillStyle = '#ffffff';
      cx.fillRect(0, 0, w, h);
      cx.drawImage(img, 0, 0, w, h);
      c.toBlob(function(blob){
        if(!blob){ setMsg('导出失败', true); URL.revokeObjectURL(url); return; }
        var pngUrl = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = pngUrl;
        a.download = (currentName.replace(/\.[^/.]+$/, '') || 'output') + '.png';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(pngUrl);
        URL.revokeObjectURL(url);
        setMsg('PNG 已保存');
      }, 'image/png');
    };
    img.onerror = function(){
      setMsg('导出 PNG 失败', true);
      URL.revokeObjectURL(url);
    };
    img.src = url;
  };

  resetBtn.onclick = function(){
    fileInput.value = '';
    currentImg = null;
    currentSrc = '';
    currentName = '';
    svgStr = '';
    previewBox.innerHTML = '<div class="empty">还没有选择图片</div>';
    svgBox.innerHTML = '<div class="empty">转换后显示在这里</div>';
    svgCode.textContent = '等待转换...';
    saveSvgBtn.disabled = true;
    savePngBtn.disabled = true;
    saveOriginalBtn.disabled = true;
    convertBtn.disabled = true;
    thSlider.value = 128;
    turdSlider.value = 2;
    alphaSlider.value = 1.0;
    thVal.textContent = 128;
    turdVal.textContent = 2;
    alphaVal.textContent = '1.0';
    setMsg('');
  };

  setMsg('工具已就绪，请选择图片');
})();
</script>
</body>
</html>
